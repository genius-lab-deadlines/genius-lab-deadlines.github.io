# Registry of tracked venues. The updater (scripts/update_deadlines.py) reads this,
# NOT _data/conferences.yml, which is generated. To add a venue, add a block here.
#
#   name:        short name shown on the site
#   description: long name
#   tags:        site tags (see _data/types.yml)
#   ccf:         path inside ccfddl/ccf-deadlines/conference/ (community source), optional
#   url:         official site URL template; {year} = 4-digit year, {yy} = 2-digit year
#   group:       section header in the generated file
#   period:      years between editions (default 1; ECCV/ICCV are 2)

- name: CVPR
  description: The IEEE/CVF Conference on Computer Vision and Pattern Recognition
  tags: [AI, CV, CONF, Tier1]
  ccf: AI/cvpr
  url: https://cvpr.thecvf.com/Conferences/{year}
  group: Computer Vision

- name: ICCV
  description: IEEE/CVF International Conference on Computer Vision
  tags: [AI, CV, CONF, Tier1]
  ccf: AI/iccv
  period: 2
  url: https://iccv.thecvf.com/Conferences/{year}
  group: Computer Vision

