name: Update deadlines

# Runs every day. Pulls community data + scrapes official conference sites,
# regenerates _data/conferences.yml, commits, and nudges GitHub Pages to rebuild.
# No human involvement needed. Trigger by hand from the Actions tab if desired.
on:
  schedule:
    - cron: "17 6 * * *"   # 06:17 UTC daily
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: update-deadlines
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Regenerate deadline data
        run: python scripts/update_deadlines.py

      - name: Commit and push if anything changed
        id: commit
        run: |
          git config user.name "deadlines-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _data/conferences.yml _data/update_status.yml
          if git diff --cached --quiet; then
            echo "No changes."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "auto: update deadlines ($(date -u +%Y-%m-%d))"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # Pushes made with the workflow token normally trigger the Pages build, but
      # request one explicitly so the site never goes stale if that ever changes.
      - name: Request GitHub Pages rebuild
        if: steps.commit.outputs.pushed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds"
